# Checks every pull request and every commit on main: types, the Python scripts, tests, the build and the Worker's bundle.
# Actions are pinned to a commit (the tag can be moved, the commit cannot); Dependabot keeps them current.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Same version in package.json and server.json
        run: node -e 'const a=require("./package.json").version,b=require("./server.json").version;if(a!==b){console.error(`package.json ${a} ≠ server.json ${b}`);process.exit(1)}'
      - run: npm run typecheck
      # The Python scripts are run by hand and by the scheduled workflows (climat.yml, every day), never by the tests:
      # at least each of them compiles.
      - name: The Python scripts compile
        run: python3 -m py_compile scripts/*.py
      - run: npm test
      - run: npm run build
      # The Worker's bundle as wrangler builds it for a deployment, without an account or the network: an import the
      # bundler refuses stops the pull request, not the deployment after the merge.
      - name: The Worker's bundle builds
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bundle"
