# The lists bundled with the server, against their source: scripts/build-irve.py, scripts/build-dae.py,
# scripts/build-ecoles.py and scripts/build-antennes.py (national bases), scripts/build-canyons.py and
# scripts/build-marmailles.py (the Région's open data portal), and scripts/build-monuments.py (the base Mérimée). Every
# Monday, each script builds its list in memory from the day's data and compares it with the bundled one, without
# writing it. Past its threshold, the job fails, saying which: the failure is the alert, someone rebuilds the list and
# proposes it. Nothing is committed from here; the lists online stay as they were.
# Its cost: five downloads (about 130 Mo for the charging points, 80 Mo for the defibrillators, 2 Mo for the schools,
# 90 Mo for the antennas, 100 Mo for the monuments), a few requests to the Région's portal (its OpenDataSoft API,
# Licence Ouverte, paced by the scripts) and a few minutes of a GitHub runner a week, free for a public repository;
# nothing on Cloudflare (no request to the Worker, no KV, no D1).
# Then fourteen lists that change seldom, each by what tells it moved (the source's date, its quarter or vintage, or its
# content when that is small): the ONF's areas and trails, OpenStreetMap's hikes, the collèges' map, the Cnaf's places,
# the ARCEP's connections, the DEPP's indices, the rents, Parcoursup, the speed cameras, FINESS, the bike lanes and racks,
# the speeds of the routes nationales, the road accidents, the operators' declared mobile coverage (the Arcep's quarter). A request or a few each, paced by the scripts. These say
# apart a list that aged (the source moved on: the job stays green, the list goes into the summary and the artifact
# listes-vieillies.json) and a check that broke (red).
# Then the places we give against a second source (scripts/verifier-positions.py): the annuaire's offices against their
# address in the Base adresse nationale, the communes' points against their town hall in OpenStreetMap. It fails only on a
# gap that is new or grew since scripts/positions-reference.json, and says a gap that closed: three requests, one each.
# With them, the bus stops of the GTFS against OSM's (the same Overpass request, and the six GTFS, about 15 Mo): only a
# stop that is newly suspect (far from any OSM stop and out of its trips' order), or a new homonym or shared point, fails.
name: Listes embarquées

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: listes
  cancel-in-progress: true

jobs:
  ecarts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LISTES_VIEILLIES: listes-vieillies.jsonl
      LISTES_CODES: listes-codes.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A point gone is said « sans information » by bornes_recharge and /bornes; a point added is not shown at all.
      - name: Bornes de recharge (base nationale des IRVE)
        id: irve
        continue-on-error: true
        run: python3 -I scripts/build-irve.py --verifier 5
      # Some devices come and go each week: past 20, the nearest one given may no longer be the nearest.
      - name: Défibrillateurs (Géo'DAE)
        id: dae
        continue-on-error: true
        run: python3 -I scripts/build-dae.py --verifier 20
      # A phone, an address or a canteen that changes is given wrong by annuaire_services_publics and /ecoles: past 10.
      - name: Écoles, collèges et lycées (annuaire de l'Éducation nationale)
        id: ecoles
        continue-on-error: true
        run: python3 -I scripts/build-ecoles.py --verifier 10
      # A few supports come and go each month; past 15, the counts of /antennes and of fiche_terrain are off. The ANFR's
      # files are read at one request a minute per host: a few minutes.
      - name: Antennes (ANFR)
        id: antennes
        continue-on-error: true
        run: python3 -I scripts/build-antennes.py --verifier 15
      # Any canyon added, gone or changed fails it (a ban by decree is one line): the portal's date of change moves with no
      # change of content (16/11/2026), so the lists are compared, entry by entry, not dated.
      - name: Canyons (data.regionreunion.com)
        id: canyons
        continue-on-error: true
        run: python3 -I scripts/build-canyons.py --verifier 0
      # Any trace added, gone or changed fails it.
      - name: Sentiers marmailles (data.regionreunion.com)
        id: marmailles
        continue-on-error: true
        run: python3 -I scripts/build-marmailles.py --verifier 0
      # Any monument added, gone or changed fails it: the base changes by a few protections a year, each one a real change
      # of the page (a building classé, inscrit or delisted); its date of change moves each week with no change of content
      # (19/11/2026, the same 204 monuments as on 29/10), so the list is compared monument by monument, never dated.
      - name: Monuments historiques (Mérimée)
        id: monuments
        continue-on-error: true
        run: python3 -I scripts/build-monuments.py --verifier 0
      # A new year, or a file the ONISR corrected after the list was built, fails it: one request, not the eleven files.
      - name: Accidents de la route (ONISR)
        id: accidents
        continue-on-error: true
        run: python3 -I scripts/verifier.py build-accidents.py --verifier
      # A place renamed, moved, added or gone is given wrong by sentiers_randonnee and /randonnees: any one fails it.
      - name: Aires d'accueil (ONF)
        id: aires
        continue-on-error: true
        run: python3 -I scripts/verifier.py build-aires.py --verifier 0
      # The map is redone once a year before the school year: a newer dataset date fails it, one request.
      - name: Carte scolaire des collèges (data.education.gouv.fr)
        id: carte_scolaire
        continue-on-error: true
        run: python3 -I scripts/verifier.py build-carte-scolaire.py --verifier
      # A year's rates and counts, all new at each release: a newer dataset date fails it, one request.
      - name: Places d'accueil des jeunes enfants (Cnaf)
        id: creches
        continue-on-error: true
        run: python3 -I scripts/verifier.py build-creches.py --verifier
      # A later quarter in the file's own column fails it (2.3 Mo read).
      - name: Connexion internet par commune (ARCEP)
        id: internet
        continue-on-error: true
        run: python3 -I scripts/verifier.py build-internet.py --verifier
      # One of the five datasets put online after the list fails it: one request to the catalogue.
      - name: IPS et valeurs ajoutées (DEPP)
        id: ips
        continue-on-error: true
        run: python3 -I scripts/verifier.py build-ips.py --verifier
      # A later vintage, a new dataset each December, fails it: one search.
      - name: Carte des loyers (ministère du Logement)
        id: loyers
        continue-on-error: true
        run: python3 -I scripts/verifier.py build-loyers.py --verifier
      # A new session's data fails it, one request.
      - name: Formations Parcoursup (ministère de l'Enseignement supérieur)
        id: parcoursup
        continue-on-error: true
        run: python3 -I scripts/verifier.py build-parcoursup.py --verifier
      # Any camera added or taken down is said wrong at once by the tool and /radars: any one fails it.
      - name: Radars fixes (ministère de l'Intérieur)
        id: radars
        continue-on-error: true
        run: python3 -I scripts/verifier.py build-radars.py --verifier 0
      # A FINESS file newer than the list fails it: its date only, not the 48 Mo file.
      - name: Pharmacies, hôpitaux et cliniques (FINESS)
        id: sante
        continue-on-error: true
        run: python3 -I scripts/verifier.py build-sante.py --verifier
      # Another update stated in the dataset's description fails it, one request.
      - name: Limitations de vitesse des routes nationales (Région)
        id: vitesses
        continue-on-error: true
        run: python3 -I scripts/verifier.py build-vitesses.py --verifier
      # A trail gone can no longer be said open or closed, a hike gone keeps a GPX that is no more: past 2 added or gone.
      - name: Sentiers ONF et randonnées OpenStreetMap
        id: traces
        continue-on-error: true
        run: python3 -I scripts/verifier.py build-traces.py --verifier 2
      # A newer Région list fails it; the racks past 2 added, gone or changed. Four requests a minute apart.
      - name: Voie vélo régionale et accroches de la CIVIS
        id: velo
        continue-on-error: true
        run: python3 -I scripts/verifier.py build-velo.py --verifier 2
      # A newer quarter of the Arcep's coverage maps that has La Réunion: the map of /antennes has aged. One request, and one
      # a minute for each newer quarter.
      - name: Couverture mobile déclarée (Arcep)
        id: couverture
        continue-on-error: true
        run: python3 -I scripts/verifier.py build-couverture.py --verifier
      # An office the annuaire places far from its address, a commune's point far from its town hall: « y aller », the
      # distances and the nearest office are given wrong. Said to its producer, or the list rebuilt. A bus stop misplaced
      # by its network: the walk to it, the connections on foot and « y aller » are given wrong; said to the network.
      - name: Positions (annuaire contre BAN, communes contre mairies OSM, arrêts de bus contre OSM)
        id: positions
        continue-on-error: true
        run: python3 -I scripts/verifier-positions.py --verifier
      # The fourteen run through scripts/verifier.py: a list that aged (its source moved on) is a warning in its step, a
      # line of the job's summary and of listes-vieillies.json, and the job stays green, for nothing is broken:
      # someone rebuilds the list and proposes it. Only a broken check (a source that did not answer, an exception) is red.
      - name: Listes vieillies et vérifications cassées
        if: always()
        run: python3 -I scripts/verifier.py --bilan
      - name: listes-vieillies.json
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: listes-vieillies
          path: listes-vieillies.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Say what is to be redone
        if: always() && (steps.irve.outcome != 'success' || steps.dae.outcome != 'success' || steps.ecoles.outcome != 'success' || steps.antennes.outcome != 'success' || steps.canyons.outcome != 'success' || steps.marmailles.outcome != 'success' || steps.monuments.outcome != 'success' || steps.positions.outcome != 'success')
        env:
          IRVE: ${{ steps.irve.outcome }}
          DAE: ${{ steps.dae.outcome }}
          ECOLES: ${{ steps.ecoles.outcome }}
          ANTENNES: ${{ steps.antennes.outcome }}
          CANYONS: ${{ steps.canyons.outcome }}
          MARMAILLES: ${{ steps.marmailles.outcome }}
          MONUMENTS: ${{ steps.monuments.outcome }}
          POSITIONS: ${{ steps.positions.outcome }}
        run: |
          echo "::error::Bornes de recharge : $IRVE ; défibrillateurs : $DAE ; écoles : $ECOLES ; antennes : $ANTENNES ; canyons : $CANYONS ; sentiers marmailles : $MARMAILLES ; monuments historiques : $MONUMENTS ; positions : $POSITIONS. Le détail est dans l'étape en échec (écarts, ou source qui n'a pas répondu)."
          exit 1
