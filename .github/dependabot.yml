# Weekly updates, one pull request per ecosystem; security fixes come as soon as they are published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The mobile app (mobile/): Gradle plugins, libraries and the wrapper.
  - package-ecosystem: gradle
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
        update-types: [minor, patch]
