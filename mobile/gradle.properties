# Construction plafonnée par tools/build.sh (mémoire et 2 cœurs réservés par cpu-run).
org.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# Kotlin/Native (le code commun pour l'iPhone) : ses compilateurs hors du dépôt. Les klibs iOS se compilent sous
# Linux ; le framework se lie sur le Mac.
kotlin.native.enableKlibsCrossCompilation=true
kotlin.native.ignoreDisabledTargets=true
